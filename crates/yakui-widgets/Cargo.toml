[package]
name = "yakui-widgets"
description = "Built-in widgets for yakui"
version = "0.3.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SecondHalfGames/yakui"
edition = "2021"

[features]
default = ["default-fonts"]

# Built-in font storage, text rendering and widgets that contain text.
text = ["dep:cosmic-text", "dep:sys-locale"]

# Include built-in fonts.
default-fonts = ["text"]
system-fonts = ["text", "cosmic-text/fontconfig"]

[dependencies]
yakui-core = { path = "../yakui-core", version = "0.3.0" }

cosmic-text = { version = "0.19.0", optional = true, default-features = false, features = [
    "std",
    "swash",
] }
sys-locale = { version = "0.3.2", optional = true }

log.workspace = true
thunderdome.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
arboard = "3.6.1"

[dev-dependencies]
yakui = { path = "../yakui" }
yakui-test = { path = "../yakui-test" }
